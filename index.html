<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pac-Carga: eletricidade e magnetismo</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <main>
    <h1>Pac-Carga</h1>
    <p class="intro">Colete energia. Sua carga é <strong>negativa</strong>: elétrons (−) repelem e íons positivos (+) atraem quando estão perto.</p>
    <section class="hud" aria-label="Placar">
      <div>Pontos <b id="score">0</b></div><div>Vidas <b id="lives">3</b></div><div id="effect">Sem booster</div>
    </section>
    <canvas id="game" width="560" height="400" aria-label="Pac-Carga"></canvas>
    <p class="controls">No celular, deslize o dedo no labirinto. No computador, use as setas ou W, A, S e D.</p>

    <section class="legend">
      <span><i class="negative">−</i> elétron: repele</span>
      <span><i class="positive">+</i> íon: atrai</span>
      <span><i class="door">?</i> sala de pergunta</span>
    </section>
    <button id="restart" hidden>Jogar novamente</button>
  </main>
  <dialog id="question">
    <section aria-live="polite">
      <h2 id="questionTitle">Desafio</h2>
      <p id="questionText"></p>
      <div id="answers"></div>
    </section>
  </dialog>
  <script src="game.js?v=2"></script>
</body>
</html>
